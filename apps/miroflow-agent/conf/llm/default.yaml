# conf/llm/default.yaml - Default LLM configuration
provider: "openai" # openai, anthropic, qwen
model_name: "deepseek-v4-pro"
async_client: false
temperature: 0.3
top_p: 1.0
min_p: 0.0
top_k: -1
max_tokens: 4096
api_key: ${oc.env:DEEPSEEK_API_KEY,""}
base_url: https://api.deepseek.com
repetition_penalty: 1.0
