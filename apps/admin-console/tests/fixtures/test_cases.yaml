  answer: '### 华力创科学（深圳）有限公司相关信息

    华力创科学（深圳）有限公司成立于 2019 年 7 月 18 日，法定代表人鱼晨，属先进制造行业，是力传感技术开发商。


    团队：董事长刘宏斌（中科院百人计划学者、英国伦敦大学国王学院教授），副董事长杨志胜（中科院智能微创医疗技术团队主任、世界 500 强高管经验），产品负责人鱼晨。

    注册与联系方式：注册地址深圳市龙岗区宝龙街道宝荷大道 76 号智慧家园 B 座 2101；网址http://www.haptron-scientific.com/，邮箱
    412758581@qq.com，电话 0755-84202167。

    核心业务与技术：聚焦工业与医疗器械传感器研发，提供光学原理的力觉传感器（六维力矩、触觉等），应用于人形机器人、医疗、工业生产等领域；首创光学多模态感知技术，开发出全球最小（直径
    8.5mm）、量程 700N 的光基六维力传感器，打破国外垄断。

    产品：Photon 系列（Photon Finger、Photon-Blade 等），特点是高精度、微型化、工业级可靠性，成本千元级，支持金属 3D 打印定制；已应用于腾讯、强脑科技等企业，覆盖金属
    3D 打印、医疗微创手术（如机器人针灸）等领域。

    发展与融资：处于 A + 轮阶段，融资数千万人民币，2025 年 1 月由铂力特独家投资；拥有全球首条光学力传感器全自动生产线（2023 年 7 月投产），规模少于
    50 人，注册资本约 3000 万元。

    #### 产量特点

