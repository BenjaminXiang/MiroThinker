  query: 我关注的是深圳智航无界科技
  answer: '深圳智航无界科技的核心关联主体为深圳无界智航科技有限公司（项目简称 “无界智航”），其行业为具身智能，是清华大学深圳研究生院丁文伯老师创业项目，CEO
    穆世龙，联创熊祺来自蔚来智驾团队，聚焦 “硬件 + 数据 + 算法” 全链条创新，产品包括可穿戴数采套件（X-H1）、合成仿真学习框架（X-Sim）、跨本体学习模型，应用于无人零售、酒店、餐饮、家庭养老等场景，目前天使轮融资首次交割进行中，自研数采设备达小批量量产，与美团、字节等客户对接中。


    另有关联度较高的深圳智航无人机有限公司，行业为先进制造，是无人机研发制造商，成立于 2014 年 10 月 10 日，法定代表人金良，产品有 V800 油电混动无人机、V600
    油电混合无人机等，应用于山区及海岛应急医疗物资投送、城市 - 乡村低空物流等场景。


    两者均为深圳本地科技企业，但分属具身智能与无人机不同细分赛道。其他行业相关企业（边界智控科技、鹰驾科技、鼎界科技）无直接关联。'
