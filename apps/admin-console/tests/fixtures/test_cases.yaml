    产品优势：核心产品性能全球领先（最小尺寸、最大量程、高精度高可靠性），获2024年度深圳市“孔雀团队”重点科技研发支持。

    市场认可：2024年客户咨询量显著增长，已与腾讯、强脑科技、速腾聚创、优必选等头部企业合作；广东省省长、香港特首等领导体验其产品，为全球光基多维力觉传感技术领跑者。'
