  is_head_turn: true
  query: 介绍清华的丁文伯
  answer: '清华丁文伯教授信息


    基本信息：副教授，邮箱 ding.wenbo@sz.tsinghua.edu.cn，地址 Information Building, SIGS campus，个人网址http://www.sigs.tsinghua.edu.cn/dwb/main.htm。

    教育经历：2007-2011 年清华大学电子工程系学士，2011-2016 年清华大学电子工程系博士。

    工作经历：2016-2019 年佐治亚理工学院博士后；2019-2022 年清华大学深圳国际研究生院清华 - 伯克利深圳学院助理教授；2022 至今清华大学深圳国际研究生院数据与信息研究院副教授。

    研究领域：信号处理、机器人技术、人机交互、机器学习；补充机器人学、智能感知与机器人、智能物联网（AIOT）、智慧感知与协同、大数据、人工智能与深度学习理论。

    学术兼职：Digital Signal Processing: A Review Journal Associate Editor，Ubicomp/ISWC’21
    CPD Workshop Co-Chair，IEEE SmartGridComm 2019 Workshop Co-Chair，40 余期刊会议审稿人。

    奖励荣誉：2021 年国家重点人才计划青年项目，2020 年 Loughborough University IAS Residential Fellow，2019
    年电子学会自然科学二等奖、第 47 届日内瓦发明金奖，2016 年清华大学紫荆学者未来研究者 fellowship、优秀博士论文、优秀博士毕业生、北京市优秀博士毕业生，2015
    年 IEEE Scott Helt Memorial Award、清华大学特等奖学金、林枫辅导员奖等。

    科研进展：与周光敏团队提出磁驱动柔性电池集；与刘碧录团队研发全自驱动建筑形变感存算一体系统；研制摩擦纳米发电机自供能系统；透明物体抓取新进展；与付红岩团队构建摩擦电传感器多维人机界面。

    学生工作与学术交流：曾任清华电子系学生会主席、本科生辅导员；2011 级博士生（博士三年级发首篇 SCI）；主持 IROS 圆桌 “到底应该模型驱动，还是数据驱动？”
    讨论；建议电子系宽口径本科教育、企业合作培养人才。'
