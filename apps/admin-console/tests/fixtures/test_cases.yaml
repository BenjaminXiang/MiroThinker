    微型化与高性能：研发全球最小六维力传感器（直径8.5mm）、光基指尖多维力传感器（量程700N），精度达0.05N级，可靠性通过10万次疲劳测试（-10℃~80℃循环）。

    成本与定制化：全自动化产线使成本降至千元级，支持金属3D打印快速定制，首条全自动光学力觉传感器生产线投产在即。

