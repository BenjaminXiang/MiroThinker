- qid: 7
  turn_group: 问题4
  is_head_turn: true
  query: 请介绍无界智航的相关信息
  answer: '无界智航是聚焦具身智能领域的企业，2025 年 6 月 30 日成立，法定代表人穆世龙，注册地址位于深圳市南山区粤海街道。


    核心业务与定位：全球具身智能全栈解决方案引领者，以 “数据驱动具身智能” 为使命，聚焦 “硬件 + 数据 + 算法” 全链条创新，构建 “真实 + 合成”
    通用具身数据引擎，研发 “稳定 - 可拓展的超级具身智能系统”。


    团队构成：创始人 & CEO 穆世龙为清华大学硕士、具身智能领域青年科学家；联合创始人熊祺曾任蔚来汽车自动驾驶算法专家，有万级量产交付经验；联合创始人 &
    首席科学家丁文伯是清华大学深圳国际研究生院副教授、国家青年特聘专家；团队汇聚清华、上交等顶尖高校科创精英，具备前沿技术落地与软硬件大规模量产经验。


    融资情况：2025 年完成 8000 万元天使轮融资。


    产品与技术：拥有可穿戴数采套件（X-H1，整合多模态同步数据，兼容多类型机械臂 / 灵巧手）、合成仿真学习框架（X-Sim，覆盖 300 类技能、200 类
    + 对象、100 + 泛化场景）、跨本体学习模型（构建异构数据融合模型）。


    应用场景：覆盖无人零售、酒店、餐饮、家庭养老等领域。


    最新进展：天使轮融资首次交割进行中，自研数采设备（手套 + 眼镜）达小批量量产状态，与美团、字节、华住会等对接需求。


    企业主体补充：关联企业有 2024 年 5 月成立的深圳智航无界科技（经营范围含人工智能行业应用系统集成服务等），及 2025 年 2 月成立的无界智航（广南县）科技（经营范围含民用航空器驾驶员培训等）。


    核心业务与技术方向补充：一是无人机抗干扰模块研发，推出国内首款自主融合型无人机抗干扰模块，相关项目获中国国际大学生创新大赛职教赛道银奖等；二是人工智能与具身智能系统，聚焦数据驱动的超级具身智能系统，解决具身数据闭环缺失问题。


    合作与荣誉：是温江区低空经济军创赋能中心首批入驻企业，参与 2025 现代汽车集团 “灯塔” 开放创新计划 DemoDay，项目成果在深圳智能机器人灵巧手大赛等展出。


    注意事项：与聚焦自动驾驶的轻舟智航无直接关联；广南县科技公司与深圳智航无界科技业务领域不同。'
