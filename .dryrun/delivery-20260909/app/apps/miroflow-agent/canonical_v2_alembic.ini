# Independent migration history for the clean Canonical V2 database.
#
# Required target inputs:
#   ALEMBIC_DATABASE_URL=postgresql+psycopg://.../explicit_candidate
#   ALEMBIC_EXPECTED_DATABASE=explicit_candidate
#   ALEMBIC_TARGET_KIND=isolated-candidate
#   CANONICAL_V2_BACKUP_GATE_ROOT=/absolute/path/to/rebuild-change-run
#
# Generic DATABASE_URL and DATABASE_URL_TEST values are never migration inputs.

[alembic]
script_location = %(here)s/canonical_v2_alembic
sqlalchemy.url =
file_template = %%(rev)s_%%(slug)s
timezone = UTC
truncate_slug_length = 40
revision_environment = false
sourceless = false

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
